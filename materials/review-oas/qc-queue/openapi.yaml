          type: string
          format: date-time
          title: Opened At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - reviewer_id
      - reviewer_name
      - opened_at
      - expires_at
      title: QcAnnotationSessionHolderOut
      description: Other user currently holding the annotation session for an item.
