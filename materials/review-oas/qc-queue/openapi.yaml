    ## Dùng cho test

    - **Phạm vi:** 13 path / 13 operation.
    - `x-portal-permissions` = permission key handler yêu cầu. Có key ⇒ viết được case 403
      bằng cách gọi endpoint với user thiếu quyền đó; **không có** key ⇒ handler chỉ cần
      đăng nhập, đừng kỳ vọng 403.
    - Xác thực: Bearer JWT (Keycloak) — xem `../../authentication/openapi.yaml`.
    - Nguồn nghiệp vụ: `docs/review/qc-queue/srs.md`
    .

    ## Endpoint dùng chung — contract nằm ở spec khác

    Feature này gọi các endpoint dưới đây nhưng bản đầy đủ (schema, param, ví dụ) nằm
    ở spec của feature sở hữu, để tránh hai bản contract lệch nhau:

