          default: draft
        criteria:
          items:
            $ref: '#/components/schemas/ChecklistCriterionCreate'
          type: array
          title: Criteria
      type: object
      required:
      - version
      title: ChecklistVersionCreate
    ChecklistVersionDetailOut:
      properties:
        id:
          type: string
          title: Id
        version:
          type: string
          title: Version
        status:
          type: string
          title: Status
        created_by:
          type: string
          title: Created By
        criteria_count:
          type: integer
          title: Criteria Count
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        criteria:
          items:
            $ref: '#/components/schemas/ChecklistCriterionOut'
          type: array
          title: Criteria
      type: object
      required:
      - id
      - version
      - status
      - created_by
      - created_at
      - updated_at
      - criteria
      title: ChecklistVersionDetailOut
    ChecklistVersionListResponse:
