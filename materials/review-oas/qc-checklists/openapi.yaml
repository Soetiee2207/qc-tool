        sort_order:
          type: integer
          title: Sort Order
          default: 0
      type: object
      required:
      - name_en
      - name_vi
      title: ChecklistCriterionCreate
    ChecklistCriterionOut:
      properties:
        id:
          type: string
          title: Id
        name_en:
          type: string
          title: Name En
        name_vi:
          type: string
          title: Name Vi
        section:
          type: string
          title: Section
        expected:
          type: string
          title: Expected
        standard:
          type: string
          title: Standard
        sort_order:
          type: integer
          title: Sort Order
      type: object
      required:
      - id
      - name_en
      - name_vi
      - section
      - expected
      - standard
      - sort_order
      title: ChecklistCriterionOut
    ChecklistOptionListResponse:
      properties:
        data:
