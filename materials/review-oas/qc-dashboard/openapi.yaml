info:
  title: VD Data Platform Portal — Review Module — QC Dashboard
  version: 1.0.0
  summary: review / qc-dashboard
  description: |
    Đặc tả OpenAPI cho **Review Module — QC Dashboard** — sub-module `review`, feature `qc-dashboard`.

    Spec sinh từ `app.openapi()` của backend FastAPI (không viết tay), bổ sung thông tin
    mà OpenAPI không có: permission key thật của từng handler, envelope lỗi 401/403 của
    `backend/app/shared/deps.py`, và file/handler cài đặt (`x-code`).

    ## Dùng cho test

    - **Phạm vi:** 7 path / 8 operation.
    - `x-portal-permissions` = permission key handler yêu cầu. Có key ⇒ viết được case 403
      bằng cách gọi endpoint với user thiếu quyền đó; **không có** key ⇒ handler chỉ cần
      đăng nhập, đừng kỳ vọng 403.
    - Xác thực: Bearer JWT (Keycloak) — xem `../../authentication/openapi.yaml`.
    - Nguồn nghiệp vụ: `docs/review/qc-dashboard/srs.md`
    .

    ## Endpoint dùng chung — contract nằm ở spec khác

    Feature này gọi các endpoint dưới đây nhưng bản đầy đủ (schema, param, ví dụ) nằm
    ở spec của feature sở hữu, để tránh hai bản contract lệch nhau:

    - `/api/v1/qc/auto-assign/reviewers` → `../qc-queue/openapi.yaml`
