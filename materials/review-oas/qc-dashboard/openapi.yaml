components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token của Keycloak — chi tiết ở docs/OAS/authentication/openapi.yaml
  schemas:
    QcAnnotationSessionHolderOut:
      properties:
        reviewer_id:
          type: string
          title: Reviewer Id
        reviewer_name:
          type: string
          title: Reviewer Name
        opened_at:
          type: string
          format: date-time
          title: Opened At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - reviewer_id
      - reviewer_name
      - opened_at
      - expires_at
      title: QcAnnotationSessionHolderOut
      description: Other user currently holding the annotation session for an item.
    QcAutoAssignRulesOut:
      properties:
        enabled:
          type: boolean
          title: Enabled
        strategy:
          type: string
          title: Strategy
        max_queue_per_reviewer:
          type: integer
          title: Max Queue Per Reviewer
        auto_assign_high_priority:
          type: boolean
          title: Auto Assign High Priority
        reviewer_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Reviewer Ids
      type: object
      required:
      - enabled
      - strategy
      - max_queue_per_reviewer
      - auto_assign_high_priority
      title: QcAutoAssignRulesOut
    QcAutoAssignRulesUpdate:
      properties:
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        strategy:
          anyOf:
          - type: string
          - type: 'null'
          title: Strategy
        max_queue_per_reviewer:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Max Queue Per Reviewer
        auto_assign_high_priority:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auto Assign High Priority
        reviewer_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Reviewer Ids
      type: object
      title: QcAutoAssignRulesUpdate
    QcAutoAssignRunResponse:
      properties:
        assigned:
          type: integer
          title: Assigned
        skipped:
          type: integer
          title: Skipped
      type: object
      required:
      - assigned
      - skipped
      title: QcAutoAssignRunResponse
    QcAutoAssignStatsOut:
      properties:
        unassigned:
          type: integer
          title: Unassigned
          default: 0
        reassignable:
          type: integer
          title: Reassignable
          default: 0
      type: object
      title: QcAutoAssignStatsOut
    QcDashboardAnalyticsOut:
      properties:
        needs_review:
          $ref: '#/components/schemas/QcDashboardCohortOut'
        passed:
          $ref: '#/components/schemas/QcDashboardCohortOut'
        assignee_pass_rates:
          items:
            $ref: '#/components/schemas/QcDashboardAssigneeRateOut'
          type: array
          title: Assignee Pass Rates
        ops:
          $ref: '#/components/schemas/QcDashboardOpsOut'
        pilot:
          anyOf:
          - $ref: '#/components/schemas/QcDashboardPilotOut'
          - type: 'null'
        l1_caps:
          items:
            $ref: '#/components/schemas/QcDashboardCapOut'
          type: array
          title: L1 Caps
        difficulty_targets:
          items:
            $ref: '#/components/schemas/QcDashboardDifficultyTargetOut'
          type: array
          title: Difficulty Targets
        skill_groups_covered:
          type: integer
          title: Skill Groups Covered
          default: 0
        skill_groups_target:
          type: integer
          title: Skill Groups Target
          default: 18
      type: object
      required:
      - needs_review
      - passed
      title: QcDashboardAnalyticsOut
    QcDashboardAssigneeRateOut:
      properties:
        assignee_id:
          type: string
          title: Assignee Id
        assignee_name:
          type: string
          title: Assignee Name
        passed_hours:
          type: number
          title: Passed Hours
        failed_hours:
          type: number
          title: Failed Hours
        pass_rate:
          type: number
          title: Pass Rate
      type: object
      required:
      - assignee_id
      - assignee_name
      - passed_hours
      - failed_hours
      - pass_rate
      title: QcDashboardAssigneeRateOut
    QcDashboardBucketOut:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        count:
