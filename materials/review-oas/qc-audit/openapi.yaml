      description: Lỗi 422 theo định dạng mặc định của FastAPI/Pydantic.
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              loc:
                type: array
                items: {}
              msg:
                type: string
              input: {}
    PortalError:
      type: object
      title: PortalError
      description: Envelope lỗi 401/403 của portal. `detail` là **object** (khác định dạng mặc định của FastAPI). Sinh bởi
        `backend/app/shared/deps.py`.
      required:
      - detail
      properties:
        detail:
          type: object
          required:
          - error
          properties:
            error:
              type: object
              required:
              - code
              - message
              - details
              properties:
                code:
                  type: string
                  enum:
                  - UNAUTHORIZED
                  - FORBIDDEN
                message:
                  type: string
                details:
                  type: array
                  items:
                    type: string
                  description: 403 → permission key còn thiếu; 401 → mảng rỗng.
