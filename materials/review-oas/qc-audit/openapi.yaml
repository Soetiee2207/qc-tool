        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditQueueListResponse'
        '401':
          description: 'Thiếu hoặc không hợp lệ `Authorization: Bearer`. Backend sinh từ `backend/app/shared/deps.py`; SPA
            thử refresh token rồi replay một lần, thất bại thì clear session và điều hướng `/login`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalError'
              example:
                detail:
                  error:
                    code: UNAUTHORIZED
                    message: Invalid or missing bearer token
                    details: []
        '403':
          description: 'Thiếu quyền — handler so khớp **tất cả** key sau: `qc:audit:perform`. `details` trong body trả về
            đúng danh sách này.'
          content:
            application/json:
              schema:
