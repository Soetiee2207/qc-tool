openapi: 3.0.3
info:
  title: SalonHub order_product source-confirmed subset
  version: 1.0.0
  description: >-
    Login/bootstrap, existing cart/address, COD order creation and customer order
    listing. Partial response schemas include relevant non-secret fields only;
    omitted fields are not assertions of absence. Based on SalonHub backend source.
servers:
  - url: https://salonhub-3cg8.onrender.com
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Login using an existing account
      x-source: backend/controllers/authController.js::login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        '200':
          description: Valid credentials; secret session fields deliberately omitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Success'}
        '400': {description: Missing email or password}
        '401': {description: Account not found, inactive or incorrect password}
        '500': {description: Internal server error}
  /api/auth/profile:
    get:
      operationId: getProfile
      summary: Load current authenticated user during session bootstrap
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user profile; password excluded}
        '401': {description: Missing or invalid authentication}
        '404': {description: User not found}
  /api/cart:
    get:
      operationId: getCart
      summary: Load the current user's cart
      description: Controller also deletes cart items whose product is missing or inactive.
      x-source: backend/controllers/cartController.js::getCart
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Cart items and calculated total
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      total: {type: number}
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            productId: {type: integer}
                            quantity: {type: integer}
                            product:
                              type: object
                              properties:
                                id: {type: integer}
                                name: {type: string}
                                isActive: {type: boolean}
                                stock: {type: integer}
                                price:
                                  oneOf: [{type: number}, {type: string}]
        '401': {description: Missing or invalid authentication}
  /api/addresses:
    get:
      operationId: getMyAddresses
      summary: Load existing shipping addresses owned by the current user
      x-source: backend/controllers/addressController.js::getMyAddresses
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Addresses sorted by isDefault descending, then createdAt descending
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        fullName: {type: string}
                        phone: {type: string}
                        street: {type: string}
                        wardName: {type: string}
                        districtName: {type: string}
                        provinceName: {type: string}
                        isDefault: {type: boolean}
        '401': {description: Missing or invalid authentication}
  /api/orders:
    post:
      operationId: createOrder
      summary: Create an order from the current user's selected cart items
      description: >-
        Mutates orders, order items, reservedStock, cart and payments; sends
        notifications. Declaring this operation does not approve exploration or
        provisioning. This fixture's business scenario selects COD with no voucher.
      x-source: backend/controllers/orderController.js::createOrder
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod: {type: string, enum: [cod, cash, sepay]}
                address: {type: string, nullable: true}
                phone: {type: string, nullable: true}
                voucherCode: {type: string}
                cartItemIds:
                  type: array
                  items: {type: integer}
      responses:
        '201':
          description: Order created and committed; data.order is the created order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      order: {$ref: '#/components/schemas/Order'}
        '400': {description: Empty cart, unavailable product, insufficient stock or rejected voucher}
        '401': {description: Missing or invalid authentication}
  /api/orders/my-orders:
    get:
      operationId: getMyOrders
      summary: Load orders belonging to the current user
      x-source: backend/controllers/orderController.js::getMyOrders
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current user's orders, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
        '401': {description: Missing or invalid authentication}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Success:
      type: object
      properties:
        success: {type: boolean}
    Order:
      type: object
      properties:
        id: {type: integer}
        userId: {type: integer}
        paymentMethod: {type: string, enum: [cod, cash, sepay]}
        status:
          type: string
          enum: [pending, confirmed, packing, shipping, delivered, completed, cancelled]
        paymentStatus: {type: string, enum: [pending, paid, refunded]}
        totalAmount:
          oneOf: [{type: number}, {type: string}]
