openapi: 3.0.3
info:
  title: SalonHub password login — source-derived smoke contract
  version: '1.0.0'
  description: >-
    Chỉ operation login được xác nhận tại backend/app.js, routes/authRoutes.js
    và controllers/authController.js. Server là default trong frontend/services/api.js,
    không phải xác nhận host/commit của deployment. Không chứa credentials.
servers:
  - url: https://salonhub-3cg8.onrender.com
    description: Default API host trong source; VITE_API_URL có thể override.
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Đăng nhập bằng email hoặc số điện thoại và mật khẩu
      description: >-
        Frontend smoke dùng email. Backend từ chối trường thiếu/rỗng; tra user
        theo email hoặc phone; chặn isActive=false trước so sánh bcrypt.
        Không khai minLength, format email, rate limit hay khóa sau N lần sai
        vì handler không xác nhận những quy tắc đó.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Email hoặc số điện thoại, không được rỗng.
                password:
                  type: string
                  description: Mật khẩu, không được rỗng; không ghi giá trị thật vào fixture.
      responses:
        '200':
          description: Đăng nhập thành công; data.user không chứa password.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    type: object
                    required: [user, token]
                    properties:
                      user: {type: object, description: User đã bỏ password.}
                      token: {type: string, description: Token đăng nhập; phải giữ bí mật.}
        '400':
          description: 'Thiếu/rỗng email hoặc password: Please provide email and password.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginError'}
        '401':
          description: >-
            Không tìm thấy tài khoản hoặc sai mật khẩu: Email, Số điện thoại hoặc mật khẩu không đúng.
            isActive=false: Tài khoản của bạn đã bị khóa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginError'}
        '500':
          description: 'Handler gặp exception: Internal server error.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginError'}
components:
  schemas:
    LoginError:
      type: object
      required: [success, message]
      properties:
        success: {type: boolean, enum: [false]}
        message: {type: string}
