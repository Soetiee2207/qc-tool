openapi: 3.0.3
info:
  title: SalonHub customer E2E — source-derived contract
  version: 1.0.0
  description: Login, đọc sản phẩm/dịch vụ/giỏ/đơn/lịch hẹn cho customer_e2e_test_1.
    POST /api/cart chỉ khai để kiểm KHÔNG gửi (AC-002-2); không chứa credentials.
servers:
- url: https://salonhub-3cg8.onrender.com
  description: Default API host trong source; VITE_API_URL có thể override.
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Đăng nhập bằng email hoặc số điện thoại và mật khẩu
      description: Frontend smoke dùng email. Backend từ chối trường thiếu/rỗng; tra
        user theo email hoặc phone; chặn isActive=false trước so sánh bcrypt. Không
        khai minLength, format email, rate limit hay khóa sau N lần sai vì handler
        không xác nhận những quy tắc đó.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  description: Email hoặc số điện thoại, không được rỗng.
                password:
                  type: string
                  description: Mật khẩu, không được rỗng; không ghi giá trị thật vào
                    fixture.
      responses:
        '200':
          description: Đăng nhập thành công; data.user không chứa password.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    required:
                    - user
                    - token
                    properties:
                      user:
                        type: object
                        description: User đã bỏ password.
                      token:
                        type: string
                        description: Token đăng nhập; phải giữ bí mật.
        '400':
          description: 'Thiếu/rỗng email hoặc password: Please provide email and password.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '401':
          description: 'Không tìm thấy tài khoản hoặc sai mật khẩu: Email, Số điện
            thoại hoặc mật khẩu không đúng. isActive=false: Tài khoản của bạn đã bị
            khóa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '500':
          description: 'Handler gặp exception: Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
  /api/auth/profile:
    get:
      operationId: getProfile
      summary: Đọc hồ sơ hiện tại
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Đọc hồ sơ hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
        '404':
          description: User not found.
  /api/orders/my-orders:
    get:
      operationId: getMyOrders
      summary: Đọc đơn hàng của user hiện tại
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Đọc đơn hàng của user hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      type: object
  /api/appointments/my-appointments:
    get:
      operationId: getMyAppointments
      summary: Đọc lịch hẹn của user hiện tại
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Đọc lịch hẹn của user hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
  /api/products:
    get:
      operationId: getProducts
      summary: Danh sách sản phẩm công khai
      responses:
        '200':
          description: Danh sách sản phẩm công khai
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data: {}
      security: []
  /api/services:
    get:
      operationId: getServices
      summary: Danh sách dịch vụ công khai
      responses:
        '200':
          description: Danh sách dịch vụ công khai
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data: {}
      security: []
  /api/cart:
    get:
      operationId: getCart
      summary: Đọc giỏ hàng của user hiện tại
      responses:
        '200':
          description: Đọc giỏ hàng của user hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data: {}
      security:
      - bearerAuth: []
    post:
      operationId: addToCart
      summary: Thêm sản phẩm vào giỏ (chỉ khai để kiểm không gửi)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - productId
              properties:
                productId:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Đã thêm vào giỏ
        '401':
          description: Chưa đăng nhập
components:
  schemas:
    LoginError:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
