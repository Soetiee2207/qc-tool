# Reviewed test-only policy. Script replaces APPLICATION_BASE with fresh loopback origin.
fixtures:
  customer_fixture:
    email: {env: ACCEPTANCE_EMAIL}
    password: {env: ACCEPTANCE_PASSWORD}
    facts: {role: customer, account_state: active}
  negative_fixture:
    email: {env: ACCEPTANCE_EMAIL}
    password: {env: ACCEPTANCE_PASSWORD}
    wrong_password: {env: ACCEPTANCE_WRONG_PASSWORD}
    facts: {role: customer, account_state: active}
bindings:
  AC-autonomous-001-2: {email: customer_fixture.email, password: customer_fixture.password}
  AC-autonomous-001-3: {email: negative_fixture.email, password: negative_fixture.wrong_password}
acquisition:
  requirements:
    AC-autonomous-001-2:
      - fixture: customer_fixture
        aliases: [customer_fixture.email, customer_fixture.password]
        facts: {account_exists: true, role: customer, account_state: active, password_valid: true}
        require_verified: true
        source_ref: urd.md:AC-001-2
    AC-autonomous-001-3:
      - fixture: negative_fixture
        aliases: [negative_fixture.email, negative_fixture.password, negative_fixture.wrong_password]
        facts: {account_exists: true, role: customer, account_state: active}
        require_verified: true
        source_ref: urd.md:AC-001-3
  provisioning:
    - fixture: customer_fixture
      operation_id: createCustomer
      provides: {account_exists: true, role: customer, account_state: active, password_valid: true}
      external_interaction: false
  provisioning_rules:
    - fixture: customer_fixture
      operation_id: createCustomer
      inputs:
        email: {alias: customer_fixture.email}
        password: {alias: customer_fixture.password}
        role: {literal: customer}
      expected: {status: 201, json: {'$.success': true}}
      establishes: {account_exists: true, role: customer, account_state: active, password_valid: true}
      verification_required: true
      cleanup: {}
      policy:
        approved: true
        allowed_environment: local
        allowed_base_urls: [APPLICATION_BASE]
        mutation_type: create_fixture
        external_interaction: false
        whitelisted_operations: []
      source_ref: autonomous_acceptance_app.py:in-memory-customer-contract
  verification:
    - fixture: customer_fixture
      operation_id: establishSession
      body_aliases: {email: customer_fixture.email, password: customer_fixture.password}
      expected: {status: 200, json: {'$.success': true}}
      proves: {account_exists: true, role: customer, account_state: active, password_valid: true}
      policy: {approved: true, test_data_mutation: false, side_effects: [session_creation]}
      source_ref: autonomous_acceptance_app.py:session-check-reviewed-implication
    - fixture: negative_fixture
      operation_id: establishSession
      body_aliases: {email: negative_fixture.email, password: negative_fixture.password}
      expected: {status: 200, json: {'$.success': true}}
      proves: {account_exists: true, role: customer, account_state: active}
      policy: {approved: true, test_data_mutation: false, side_effects: [session_creation]}
      source_ref: autonomous_acceptance_app.py:session-check-reviewed-implication
