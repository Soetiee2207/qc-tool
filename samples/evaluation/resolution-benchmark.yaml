# Benchmark hư cấu, replay offline hoàn toàn. Không truy cập URL trong file.
benchmark:
  name: resolution-failure-modes-v1
  max_cycles: 3
  note: Fictional offline replays derived from existing repository failure-mode tests. Expected unresolved
    outcomes are safe abstentions, not executable successes.
  expected_summary:
    total_cases: 24
    executable_before: 0
    executable_after: 13
    cases_regressed: 0
    false_repairs: 0
    unsafe_repairs: 0
    rejected_proposed_changes: 6
    replay_errors: 0
  label_policy: Allowed snapshots for abstention cases mean preserving unresolved source semantics, not executable
    repair. Two business assertions without a deterministic oracle are deliberately unlabelled.
cases:
- category: deterministic_ui
  covers:
  - missing_locator
  - valid_deterministic_repair
  references:
  - tests/test_resolve.py::test_unique_ui_match_resolves_locator_and_records_evidence
  expected:
    executable: true
    cycle_count: 1
    stop_reason: EXECUTABLE
    applied_repairs: 1
    rejected_proposals: 0
    issue_codes: []
  case:
    id: TC_BENCH_001
    module: BENCH
    title: Unique Sign in locator
    objective: Click Sign in using the unique named control
    traces_to:
    - FR-BENCH-001
    provenance:
      source_quote: Click Sign in using the unique named control
      source_ref: fixture:benchmark:1
    steps:
    - seq: 1
      kind: when
      action: ui.goto
      args:
        url: /login
    - seq: 2
      kind: when
      action: ui.click
      args:
        by_name: Sign in
    - seq: 3
      kind: then
      action: assert.url_matches
      args:
        pattern: /dashboard
  base_url: https://benchmark.test
  requirements:
  - id: FR-BENCH-001
    statement: Click Sign in using the unique named control
  ground_truth:
  - step_seq: 2
    allowed:
