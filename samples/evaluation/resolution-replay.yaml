# Bộ replay hư cấu. Không gọi LLM, trình duyệt hay URL trong file.
cases:
  - case:
      id: TC_LOGIN_001
      module: LOGIN
      title: Login
      objective: Check login navigation
      traces_to: [FR-LOGIN-001]
      provenance:
        source_quote: Click Login to open /dashboard
        source_ref: fixture:login
      steps:
        - seq: 1
          kind: when
          action: ui.goto
          args: {url: /login}
        - seq: 2
          kind: when
          action: perform.unmapped
          args: {description: Click Login}
        - seq: 3
          kind: then
          action: assert.url_matches
          args: {pattern: /dashboard}
    base_url: https://evaluation.test
    requirements:
      - id: FR-LOGIN-001
        statement: Click Login to open /dashboard
    ground_truth:
      - step_seq: 2
        allowed:
          - {action: ui.click, args: {target: btn-login}}
    resolution_responses:
      - testcase_id: TC_LOGIN_001
        changes: []
        unresolved:
          - {code: UNMAPPED_ACTION, step_seq: 2, reason: Need login control evidence}
      - testcase_id: TC_LOGIN_001
        changes:
          - step_seq: 2
            from_action: perform.unmapped
            gap_codes: [UNMAPPED_ACTION]
            proposed: {action: ui.click, args: {target: btn-login}}
            reason: Source explicitly says Click Login
            evidence:
              - source: ui-map
                ref: {page: "https://evaluation.test/login", test_id: btn-login}
        unresolved: []
    exploration_responses:
      - testcase_id: TC_LOGIN_001
        requests:
          - target: /login
            session: anonymous
            purposes:
              - {gap_code: UNMAPPED_ACTION, step_seq: 2, intent: inspect_page, reason: Inspect explicit login route}
    explorations:
      - request: {target: /login, session: anonymous}
        result:
          request: {target: "https://evaluation.test/login", session: anonymous}
          final_url: https://evaluation.test/login
          page:
            url: https://evaluation.test/login
            title: Login
            text: [Login]
            elements:
              - {id: login, test_id: btn-login, role: button, name: Login, tag: button}
          forms: [{id: login-form, method: POST, action: "https://evaluation.test/login"}]
          network: []
          issues: []
          truncated: []
          source:
            type: playwright_exploration
            page: https://evaluation.test/login
            observed_at: "2026-10-05T09:01:00+07:00"
  - case:
      id: TC_ACCESS_001
      module: ACCESS
      title: Delete is hidden
      objective: Normal users must not see Delete
      traces_to: [FR-ACCESS-001]
      provenance:
        source_quote: Normal users must not see Delete
        source_ref: fixture:access
      steps:
        - {seq: 1, kind: when, action: ui.goto, args: {url: /login}}
        - {seq: 2, kind: then, action: assert.unmapped, args: {expected: Delete hidden}}
    base_url: https://evaluation.test
    ui_map: ui-map.yaml
    requirements:
      - {id: FR-ACCESS-001, statement: Normal users must not see Delete}
    ground_truth:
      - step_seq: 2
        allowed:
          - {action: assert.not_visible, args: {target: btn-delete}}
        unsafe:
          - {action: assert.visible, args: {target: btn-delete}}
    resolution_responses:
      - testcase_id: TC_ACCESS_001
        changes:
          - step_seq: 2
            from_action: assert.unmapped
            gap_codes: [UNMAPPED_ACTION]
            proposed: {action: assert.visible, args: {target: btn-delete}}
            reason: Current UI exposes Delete
            evidence:
              - source: ui-map
                ref: {page: "https://evaluation.test/login", test_id: btn-delete}
        unresolved: []
    exploration_responses:
      - {testcase_id: TC_ACCESS_001, requests: []}
