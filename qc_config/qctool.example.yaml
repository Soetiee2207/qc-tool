# Cấu hình một lượt chạy QC. Copy file này ra chỗ khác rồi sửa.
#
#   uv run qctool all --config qctool.yaml
#
# Đường dẫn tương đối tính từ vị trí file này.

# ── Tên feature — dùng cho ID testcase và tên thư mục output ─────────────────
feature: login-sso
module: AUTH

# ── Đầu vào (đưa ít nhất một) ────────────────────────────────────────────────
# Tài liệu: sinh case từ requirement (acceptance criteria, NFR)
docs_dir: /home/hendry/workspace/data-platform/data-management/vd-data-platform-portal/docs/authentication/login-sso

# OpenAPI: sinh case kỹ thuật (boundary, mã lỗi, xác thực). Đầy đủ hơn nhiều.
# Khi có spec thật thì bỏ comment dòng dưới.
# openapi: ./openapi.yaml

# ── Môi trường cần test ──────────────────────────────────────────────────────
run:
  # Để trống thì chỉ sinh testcase, không chạy.
  base_url: https://dev-qc-portal.datafactory.fit
  timeout_seconds: 30
  verify_ssl: true

# ── Xác thực ─────────────────────────────────────────────────────────────────
# mode: browser | token | password | manual
#   browser  — mở trình duyệt và đăng nhập qua form của IdP (dùng cho test UI)
#   token    — dán sẵn bearer token
#   password — OIDC password grant
#   manual   — không xác thực. KHÔNG tự đăng nhập dù `.env` có tài khoản.
#
# ĐỪNG ghi mật khẩu vào file này rồi commit. Dùng biến môi trường thay thế,
# hoặc chạy qua giao diện web (bí mật không lưu lại).
llm:
  enabled: false  # bật khi đã điền QCTOOL_LLM_MODEL/API_KEY trong env; không ghi key vào YAML

auth:
  mode: manual
  # token: "eyJhbGciOi…"
  # username: user@example.com
  # password: "…"

# ── Test UI/UX bằng trình duyệt thật ─────────────────────────────────────────
# Chỉ có tác dụng khi khai `web_url` ở trên. Không khai mục này thì tool chạy
# đúng như trước: không mở trình duyệt cho case UI nào không cần.
ui:
  # Số lần chạy lại case hỏng (0–3). Case đạt ở lần sau bị đánh dấu **chập chờn**,
  # không tính là đạt sạch.
  retry: 0

  # Bằng chứng lưu vào <out.dir>/evidence/: off | on-fail | always
  evidence: on-fail

  # Trace Playwright mỗi case — xem lại từng bước:
  #   uv run playwright show-trace <out.dir>/evidence/<MÃ_TEST>.trace.zip
  trace: false

  # Quét accessibility bằng axe-core (cần mạng lần đầu, hoặc chép sẵn
  # qctool/execute/axe.min.js để chạy offline)
  axe: false

  # Bước kiểm tra sai không dừng case — chạy hết để thấy mọi lỗi trong một lượt
  soft_assert: false

  # Kích thước cửa sổ, dạng "1440x900" hoặc {width: 1440, height: 900}
  viewport: 1440x900

# ── Đầu ra ───────────────────────────────────────────────────────────────────
out:
  # dir để trống thì mặc định là artifacts/<feature>/
  # dir: ../artifacts/login-sso
  skip_run: false
  created_by: "@binhhm"
