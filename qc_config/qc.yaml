# Cấu hình một lượt chạy QC.
#
# Sửa file này MỘT LẦN, sau đó mỗi lần dùng chỉ cần:
#
#     ./qc.sh
#
# Tài khoản KHÔNG ghi ở đây — lấy từ `.env` (đã gitignore).
# File này commit được vì không chứa bí mật.

feature: login-sso
module: AUTH

# ── Đầu vào ─────────────────────────────────────────────────────────────────
# Tài liệu yêu cầu: sinh testcase từ acceptance criteria + NFR
docs_dir: /home/hendry/workspace/data-platform/data-management/vd-data-platform-portal/docs/authentication/login-sso

# Đặc tả API: sinh testcase kỹ thuật chạy được ngay (biên, mã lỗi, xác thực).
# Đây là nguồn giá trị nhất — đổi sang đường dẫn file OAS thật của bạn.
# Lấy từ FastAPI:
#   python -c "import json,app.main; print(json.dumps(app.main.app.openapi()))" > openapi.json
openapi: /home/hendry/workspace/data-platform/data-management/vd-data-platform-portal/docs/OAS/authentication/openapi.yaml

# Link webapp cần test — tool mở trình duyệt thật, đăng nhập, dò element
web_url: https://dev-qc-portal.datafactory.fit

# ── Chạy test ───────────────────────────────────────────────────────────────
run:
  # Địa chỉ API. Để trống thì lấy web_url.
  base_url: https://dev-qc-portal.datafactory.fit
  timeout_seconds: 30
  verify_ssl: true

# ── Xác thực ────────────────────────────────────────────────────────────────
# Tài khoản lấy từ `.env`; KHÔNG ghi mật khẩu vào đây.
auth:
  mode: browser

# ── Test UI/UX bằng trình duyệt thật ────────────────────────────────────────
ui:
  retry: 1                 # hỏng thì chạy lại 1 lần, để tách chập chờn khỏi lỗi thật
  evidence: on-fail        # ảnh chụp vào <out.dir>/evidence/ khi test hỏng
  trace: false             # bật lên khi cần xem lại từng bước bằng trace viewer
  axe: false               # quét accessibility (cần mạng, hoặc axe.min.js cục bộ)
  soft_assert: false       # true = chạy hết case dù có bước sai
  viewport: 1440x900

# ── Đầu ra ──────────────────────────────────────────────────────────────────
out:
  # Thư mục kết quả. Để trống thì mặc định artifacts/<feature>/
  # dir: ../artifacts/login-sso
  created_by: "@binhhm"

  # true = chỉ sinh testcase, không chạy
  skip_run: false

  # true = chạy trình duyệt ẩn. Đặt false nếu muốn nhìn Chrome chạy.
  headless: true
