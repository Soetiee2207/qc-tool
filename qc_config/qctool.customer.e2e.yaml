# Account customer do người dùng xác nhận hợp lệ; tin cậy khai báo operator.
# Không probe verification trước testcase; credential chỉ lấy từ env.
# Testcase login vẫn kiểm tra HTTP/URL thật, không tự coi là Pass.
feature: customer
module: CUSTOMER
generation:
  profile: agent
  budget: # mỗi intent (AC): số lượt gọi LLM / token / giây
    max_turns: 14
    max_tokens: 90000
    max_seconds: 480
    completion_tokens: 2200
docs_dir: ../samples/customer
openapi: ../samples/customer/openapi.yaml
web_url: https://salonhub-soe.vercel.app
run:
  base_url: https://salonhub-3cg8.onrender.com
  timeout_seconds: 45 # Render có thể cold start
  verify_ssl: true
auth:
  mode: browser # đăng nhập trước bằng .env → agent có macro authenticate:active_user
llm:
  enabled: true # agent DeepSeek viết testcase; đặt QCTOOL_LLM_THINKING=disabled trong .env
provisioning:
  enabled: false
  environment: production
ui:
  retry: 0
  evidence: always
  trace: true
  # ⚠ Trace cả case đăng nhập: evidence/*.trace.zip chứa MẬT KHẨU/TOKEN thật.
  # Chỉ xem cục bộ, xoá sau khi xem, không chia sẻ/commit. Tắt (false) khi không cần.
  trace_sensitive: true
out:
  dir: ../artifacts/customer-e2e
  skip_run: false
  headless: true
test_fixtures:
  fixtures:
    active_user:
      email:
        env: QCTOOL_USERNAME
      password:
        env: QCTOOL_PASSWORD
      facts:
        role: customer
        account_state: active
  bindings:
    AC-customer-001-1:
      email: active_user.email
      password: active_user.password
      correct_password: active_user.password
    AC-customer-001-3:
      email: active_user.email
      password: active_user.password
      correct_password: active_user.password
    AC-customer-001-4:
      email: active_user.email
      password: active_user.password
      correct_password: active_user.password
    AC-customer-001-5:
      email: active_user.email
      password: active_user.password
      correct_password: active_user.password
    AC-customer-001-6:
      email: active_user.email
      password: active_user.password
      correct_password: active_user.password
  acquisition:
    requirements:
      AC-customer-001-1:
        - fixture: active_user
          aliases:
            - active_user.email
            - active_user.password
          facts:
            account_exists: true
            password_valid: true
            account_state: active
          require_verified: false
          source_ref: samples/customer/urd.md:AC-001-1
      AC-customer-001-3:
        - fixture: active_user
          aliases:
            - active_user.email
            - active_user.password
          facts:
            account_exists: true
            password_valid: true
            account_state: active
          require_verified: false
          source_ref: samples/customer/urd.md:AC-001-3
      AC-customer-001-4:
        - fixture: active_user
          aliases:
            - active_user.email
            - active_user.password
          facts:
            account_exists: true
            password_valid: true
            account_state: active
          require_verified: false
          source_ref: samples/customer/urd.md:AC-001-4
      AC-customer-001-5:
        - fixture: active_user
          aliases:
            - active_user.email
            - active_user.password
          facts:
            account_exists: true
            password_valid: true
            account_state: active
          require_verified: false
          source_ref: samples/customer/urd.md:AC-001-5
      AC-customer-001-6:
        - fixture: active_user
          aliases:
            - active_user.email
            - active_user.password
          facts:
            account_exists: true
            password_valid: true
            account_state: active
          require_verified: false
          source_ref: samples/customer/urd.md:AC-001-6
    evidence:
      - fixture: active_user
        facts:
          account_exists: true
          password_valid: true
          account_state: active
          role: customer
        assurance: DECLARED
        source_ref: operator:confirmed-existing-customer-account
