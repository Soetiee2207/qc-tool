# Config DEMO — chạy trên API giả, không cần hệ thống thật.
#
#     ./qc.sh --config qc-demo.yaml
#
# Mục đích: xem tool hoạt động đầy đủ (sinh → chạy → báo cáo) trước khi
# chạy trên hệ thống thật. API giả có 4 bug cài sẵn nên sẽ thấy cả Đạt lẫn Lỗi.
#
# Cần bật API giả trước:
#     nohup setsid uv run python -m tests.mock_server --port 8099 > /tmp/mock.log 2>&1 < /dev/null &

feature: demo
module: DEMO

# Chỉ có OpenAPI, không có tài liệu — để so sánh với qc.yaml
openapi: ./samples/openapi/task-manager-sample.yaml

run:
  base_url: http://127.0.0.1:8099/api/v1
  timeout_seconds: 10

auth:
  mode: token
  token: demo-token

out:
  dir: ./artifacts/demo
  created_by: "@binhhm"
